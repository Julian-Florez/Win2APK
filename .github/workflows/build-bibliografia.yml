name: Build bibliography PDFs

on:
  push:
    branches: [main]
    paths:
      - 'bibliografia_manifest.json'
      - '.github/scripts/fetch_bibliografia.py'
      - '.github/workflows/build-bibliografia.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests reportlab
      - name: Fetch open PDFs and create blank replacements
        run: python .github/scripts/fetch_bibliografia.py bibliografia_manifest.json bibliografia
      - name: Commit bibliography
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bibliografia
          git commit -m "Add bibliography PDFs and final index" || exit 0
          git push
