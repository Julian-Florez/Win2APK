name: Deploy Win2APK site to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/no-duplicate-game-data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/images _site/assets/logo _site/assets/video _site/manual _site/documentacion _site/config

          cp sustentaciones/01-primera-sustentacion/presentacion-vigente.html _site/index.html
          cp sustentaciones/01-primera-sustentacion/assets/images/cuphead-snapdragon-reference.png _site/assets/images/
          cp sustentaciones/01-primera-sustentacion/assets/images/cuphead-pixel-mali-reference.png _site/assets/images/
          cp sustentaciones/01-primera-sustentacion/assets/logo/win2apk-primary.svg _site/assets/logo/
          cp sustentaciones/01-primera-sustentacion/assets/video/demo-cuphead-pixel-80s.mp4 _site/assets/video/
          cp sustentaciones/01-primera-sustentacion/assets/video/demo-cuphead-pixel-poster.png _site/assets/video/

          cp documentacion/12-guia-empaquetado-win2apk.html _site/manual/index.html
          cp documentacion/index.md _site/documentacion/
          cp config/win2apk.json config/example.testapp.json _site/config/

          # El manual conserva su ruta secundaria y enlaces relativos al sitio.
          sed -i \
            -e 's#href="./index.md"#href="../documentacion/index.md"#g' \
            _site/manual/index.html

          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
