name: Deploy manual to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/no-duplicate-game-data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/documentacion _site/config

          cp documentacion/12-guia-empaquetado-win2apk.html _site/documentacion/
          cp documentacion/index.md _site/documentacion/
          cp config/win2apk.json config/example.testapp.json _site/config/

          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=documentacion/12-guia-empaquetado-win2apk.html">
            <link rel="canonical" href="./documentacion/12-guia-empaquetado-win2apk.html">
            <title>Manual de Win2APK</title>
          </head>
          <body>
            <p><a href="documentacion/12-guia-empaquetado-win2apk.html">Abrir el manual de Win2APK</a></p>
          </body>
          </html>
          EOF

          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
