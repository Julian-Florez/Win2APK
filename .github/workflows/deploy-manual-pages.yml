name: Deploy manual to GitHub Pages

on:
  push:
    branches:
      - main
      - codex/no-duplicate-game-data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/documentacion _site/config

          cp documentacion/12-guia-empaquetado-win2apk.html _site/documentacion/
          cp documentacion/12-guia-empaquetado-win2apk.html _site/index.html
          cp documentacion/index.md _site/documentacion/
          cp config/win2apk.json config/example.testapp.json _site/config/

          # El manual se sirve directamente en la raíz. Solo se ajustan sus
          # enlaces relativos porque el archivo fuente vive en documentacion/.
          sed -i \
            -e 's#../config/#config/#g' \
            -e 's#href="./index.md"#href="documentacion/index.md"#g' \
            _site/index.html

          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
